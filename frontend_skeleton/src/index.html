<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit | Daily Focus Anchor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="container">
            <h1>Daily Focus Anchor</h1>
            <div class="anchor-display">
                <p id="current-anchor">Loading anchor...</p>
            </div>
            <div class="input-group">
                <input type="text" id="anchor-input" placeholder="What is your focus today?">
                <button id="update-btn">Set Anchor</button>
            </div>
            <div id="status-message"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
